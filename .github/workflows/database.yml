name: Database

# Runs the pgTAP tests against a throwaway local Supabase stack (Docker on the runner), so no
# cloud project or secrets are needed. Only triggers when database files change.
on:
  push:
    branches: [dev, main, 'feature/**']
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'
      - '.github/scripts/supabase-clean.sh'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database.yml'
      - '.github/scripts/supabase-clean.sh'

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (the latest stable release when run #20 passed) so a new CLI release cannot
          # change the stack under an unchanged commit. Bump deliberately.
          version: 2.118.0
      - name: Clean up any existing Supabase stack
        run: bash .github/scripts/supabase-clean.sh
      - name: Start the local stack (applies supabase/migrations)
        # Run #21 failed here with a port 54322 collision. The runner is fresh, so the port was
        # most likely held by a container from this same `supabase start`. On failure: print what
        # holds the ports and the db logs, clean up completely, and try once more with --debug.
        # A real migration error fails both attempts the same way, so this cannot hide one.
        run: |
          diagnose() {
            echo "::group::Diagnostics after failed supabase start"
            docker ps -a || true
            sudo ss -ltnp '( sport >= :54320 and sport <= :54329 )' || true
            docker logs --tail 200 supabase_db_letters 2>&1 || true
            echo "::endgroup::"
          }
          if supabase start; then exit 0; fi
          echo "::warning title=supabase start::first attempt failed; cleaning up and retrying once"
          diagnose
          bash .github/scripts/supabase-clean.sh
          if supabase start --debug; then exit 0; fi
          diagnose
          exit 1
      - name: Run pgTAP tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee pgtap.log
      - name: Delivery concurrency test (two real sessions; pgTAP cannot do this)
        run: bash supabase/tests/concurrency/deliver_twice.sh
      - name: Live pg_cron delivery test (real minute-based job; ~4 minutes)
        run: bash supabase/tests/live/cron_delivery.sh
      - name: Upload pgTAP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-log
          path: pgtap.log
          if-no-files-found: warn
      - name: Check that the tests really ran
        # A green run with zero or few tests would be a silent failure. The summary is also
        # published as an annotation so it can be read without downloading the logs.
        if: always()
        run: |
          summary=$(grep -E '^(Files=|Result:)' pgtap.log | tr '\n' ' ')
          echo "::notice title=pgTAP summary::${summary:-no summary line found}"
          # Failure details as annotations too (readable through the public API, unlike the log):
          # each "not ok", its "# Failed test" diagnostics, and the per-file summary lines.
          grep -E 'not ok|# +Failed test|# +(have|want|caught|wanted|got|expected):|Parse errors|Failed tests?:|Wstat' pgtap.log \
            | head -40 | while IFS= read -r line; do echo "::error title=pgTAP failure::${line}"; done || true
          tests=$(grep -oE 'Tests=[0-9]+' pgtap.log | head -1 | cut -d= -f2)
          # 514 after Phase 6 step 1, ~580 with delivery.test.sql, +59 with delivery_cron_realtime.test.sql
          # (Phase 6 step 3A; 640 in run #22), +76 with letter_lists.test.sql and +10 with
          # send_min_lead_time.test.sql (Phase 6 M0), +4 with function_volatility.test.sql (Phase 6 M8),
          # +28 with replies.test.sql (Phase 8), +53 with safety.test.sql and +6 with
          # blocked_list.test.sql (Phase 9), +43 with push.test.sql (Phase 7 server side), +10 with
          # housekeeping.test.sql, +12 with avatars.test.sql. Raise this floor when tests are added.
          min=882
          if [ -z "$tests" ] || [ "$tests" -lt "$min" ]; then
            echo "::error title=pgTAP::expected at least $min tests, saw ${tests:-none}"
            exit 1
          fi
